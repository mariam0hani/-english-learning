<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>منصة وَمْض | Wamd AI</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: sans-serif; background: #F5F1E9; color: #8B6F5D; }
    header { background: #0D5C3A; color: white; padding: 20px 8%; display: flex; justify-content: space-between; align-items: center; }
    .logo { font-size: 22px; font-weight: bold; }
    .hero { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; padding: 40px 8%; gap: 20px; }
    .hero-text { max-width: 500px; }
    .hero h1 { font-size: 40px; color: #0D5C3A; margin-bottom: 15px; }
    .button { background: #0D5C3A; color: white; padding: 12px 24px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; font-size: 16px; margin-top: 10px; }
    .teacher { background: white; padding: 25px; border-radius: 20px; text-align: center; box-shadow: 0 5px 15px rgba(0,0,0,0.05); width: 260px; margin: 0 auto; }
    .teacher-icon { font-size: 60px; }
    .test-section { padding: 30px 8%; background: #EFE8DA; text-align: center; margin: 20px 0; border-radius: 15px; }
    .test-box { background: white; max-width: 500px; margin: 15px auto; padding: 20px; border-radius: 15px; text-align: left; }
    .test-opts label { background: #F5F1E9; padding: 8px 12px; border-radius: 6px; display: block; margin: 8px 0; cursor: pointer; }
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; padding: 40px 8%; text-align: center; }
    .card { background: white; padding: 20px; border-radius: 15px; }
    footer { background: #0D5C3A; color: white; text-align: center; padding: 20px; }
    #chatbase-bubble-button, #chatbase-message-container { display: none !important; }
  </style>
</head>

<div class="teacher">
  <div class="teacher-icon">👨🏻‍🏫</div>
  <h2 style="color:#0D5C3A;">Wamd AI</h2>
  <p>Your friendly English teacher</p>
  <button class="button" onclick="window.chatbase('open')">Start Chat</button>
</div>

<section class="test-section">
    <h2 style="color: #0D5C3A;">🎯 English Level Test</h2>
    <div class="test-box">
      <p><strong>1. She ___ to school every day.</strong></p>
      <div class="test-opts">
        <label><input type="radio" name="t1" value="wrong"> a) go</label>
        <label><input type="radio" name="t1" value="correct"> b) goes</label>
        <label><input type="radio" name="t1" value="wrong"> c) going</label>
      </div>
      <button class="button" onclick="checkLevel()">Show My Level</button>
      <p id="res" style="margin-top:10px; font-weight:bold;"></p>
    </div>
  </section>

  <section class="cards">
    <div class="card"><span>📚</span><h3 style="color:#0D5C3A;">Grammar</h3><p>Simple explanations.</p></div>
    <div class="card"><span>📝</span><h3 style="color:#0D5C3A;">Practice</h3><p>Simple questions.</p></div>
    <div class="card"><span>🤖</span><h3 style="color:#0D5C3A;">Ask Wamd</h3><p>Chat anytime.</p></div>
  </section>

  <footer>© 2026 وَمْض | Wamd AI</footer>
<script>
function checkLevel() {
  const ans = document.querySelector('input[name="t1"]:checked');
  const res = document.getElementById('res');
  if(!ans) { res.style.color="red"; res.textContent="Please select an answer!"; return; }
  if(ans.value === "correct") { res.style.color="#0D5C3A"; res.textContent="🎉 Intermediate Level!"; }
  else { res.style.color="#8B6F5D"; res.textContent="💡 Beginner Level. Ask Wamd AI!"; }
}

(function(){if(!window.chatbase||window.chatbase("getState")!=="initialized"){window.chatbase=(...arguments)=>{if(!window.chatbase.q){window.chatbase.q=[]}window.chatbase.q.push(arguments)};window.chatbase=new Proxy(window.chatbase,{get(target,prop){if(prop==="q"){return target.q}return(...args)=>target(prop,...args)}})}const onLoad=function(){const script=document.createElement("script");script.src="https://www.chatbase.co/embed.min.js";script.id="cJp9FNd9k9nqdHpwbBXDk";script.domain="www.chatbase.co";document.body.appendChild(script)};if(document.readyState==="complete"){onLoad()}else{window.addEventListener="load",onLoad)}})();
</script>
</body>
</html>
